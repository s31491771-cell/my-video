name: Render Bengali Explainer

on:
  workflow_dispatch:
    inputs:
      concurrency:
        description: "Remotion concurrency (CPU threads)"
        required: false
        default: "4"
      crf:
        description: "H.264 CRF (lower = better quality, 18 is visually lossless-ish)"
        required: false
        default: "18"
      make_release:
        description: "Attach the MP4 and delivery ZIP to a GitHub Release"
        type: boolean
        default: false
  push:
    tags:
      - "render-*"

permissions:
  contents: write

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      CONCURRENCY: ${{ inputs.concurrency || '4' }}
      CRF: ${{ inputs.crf || '18' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Python audio dependency
        run: python3 -m pip install --quiet numpy pillow

      - name: Ensure ffmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Generate the 8:52 score bed
        run: |
          python3 scripts/generate_score.py public/audio/score-full.wav --full
          test -f public/audio/score-full.wav

      - name: Verify source assets
        run: |
          test -f public/audio/voiceover.wav
          test -f public/audio/voiceover-sample.wav
          test -f public/audio/score-sample.wav
          test -f public/audio/score-full.wav
          test -f public/fonts/NotoSansBengali.ttf
          test -f public/images/rakib.png
          test -f public/images/suman.png
          count=$(ls public/audio/sfx/*.wav | wc -l)
          echo "SFX files: $count"
          test "$count" -eq 9

      - name: Audit Bengali text fit (75 scenes)
        run: python3 scripts/audit_text_fit.py

      - name: Audit audio-visual sync (195 cues)
        run: python3 scripts/audit_sync.py

      - name: Render preview stills (full film)
        run: |
          mkdir -p out/preview
          npx remotion still FullVideo out/preview/01-opening.png --frame=110
          npx remotion still FullVideo out/preview/02-office.png --frame=300
          npx remotion still FullVideo out/preview/03-2025.png --frame=700
          npx remotion still FullVideo out/preview/04-compare.png --frame=930
          npx remotion still FullVideo out/preview/05-tonight.png --frame=1600
          npx remotion still FullVideo out/preview/06-95-percent.png --frame=1880
          npx remotion still FullVideo out/preview/07-why.png --frame=2320
          npx remotion still FullVideo out/preview/08-engine.png --frame=2600
          npx remotion still FullVideo out/preview/09-quote.png --frame=3700
          npx remotion still FullVideo out/preview/10-ledger-start.png --frame=4235
          npx remotion still FullVideo out/preview/11-ledger-mid.png --frame=4700
          npx remotion still FullVideo out/preview/12-zero.png --frame=5600
          npx remotion still FullVideo out/preview/13-rakib-rule.png --frame=6000
          npx remotion still FullVideo out/preview/14-sequence.png --frame=7200
          npx remotion still FullVideo out/preview/15-20-percent.png --frame=7900
          npx remotion still FullVideo out/preview/16-one-line.png --frame=8300
          npx remotion still FullVideo out/preview/17-tier-1.png --frame=9500
          npx remotion still FullVideo out/preview/18-tier-2.png --frame=10100
          npx remotion still FullVideo out/preview/19-growth.png --frame=10750
          npx remotion still FullVideo out/preview/20-trap.png --frame=11500
          npx remotion still FullVideo out/preview/21-automation.png --frame=12555
          npx remotion still FullVideo out/preview/22-phone.png --frame=13000
          npx remotion still FullVideo out/preview/23-system.png --frame=13365
          npx remotion still FullVideo out/preview/24-cta.png --frame=14700
          npx remotion still FullVideo out/preview/25-next-question.png --frame=15200
          npx remotion still FullVideo out/preview/26-outro.png --frame=15885
          npx remotion still FullVideo out/preview/27-rule.png --frame=7933
          npx remotion still FullVideo out/preview/28-wait.png --frame=13863
          npx remotion still FullVideo out/preview/29-outro-end.png --frame=15937

      - name: Render full MP4 (8:52)
        run: |
          npx remotion render FullVideo out/full-video.mp4 \
            --concurrency="$CONCURRENCY" \
            --crf="$CRF" \
            --log=verbose

      - name: Audit audio-visual beats in the render
        id: beats
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/audit_visual_beats.py out/full-video.mp4 | tee VISUAL_BEATS.md

      - name: Quality control
        run: |
          python3 scripts/qc.py out/full-video.mp4 QC_REPORT.md \
            --expected 531.96 \
            --title "Bengali Finance Explainer — Full 8:52" \
            --samples 24

      - name: Build delivery ZIP
        if: always()
        run: bash scripts/package_delivery.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-${{ github.run_number }}
          path: |
            out/full-video.mp4
            out/preview/*.png
            QC_REPORT.md
            VISUAL_BEATS.md
            qc.json
            bengali-finance-video-delivery.zip
          if-no-files-found: warn
          retention-days: 14

      - name: Create GitHub Release
        if: ${{ always() && ((inputs.make_release == true) || startsWith(github.ref, 'refs/tags/render-')) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('render-{0}', github.run_number) }}
          name: "Bengali explainer — full 8:52 render ${{ github.run_number }}"
          body: |
            Automated Remotion render of the complete Bengali "Pay Yourself First"
            documentary explainer.

            - 1920x1080, 30 fps, H.264 (yuv420p) + AAC, 531.96 s (8:52)
            - 75 scenes cut on 195 SRT cues; no burned-in subtitles
            - Original voiceover untouched; code-generated score bed and beat-matched
              SFX cues mixed quietly under the voice
            - Uses the two real character photos (background-removed)
            - QC results: see `QC_REPORT.md` inside the delivery ZIP
          files: |
            out/full-video.mp4
            bengali-finance-video-delivery.zip
          fail_on_unmatched_files: true

      # The Actions log and artifacts need authentication to read, so mirror the
      # QC verdict to a public branch. That keeps failures diagnosable without
      # login: raw.githubusercontent.com/<repo>/qc-reports/QC_REPORT.md
      - name: Gate on the audio-visual beat audit
        if: always()
        run: |
          if [ "${{ steps.beats.outcome }}" != "success" ]; then
            echo "::error::the render has cues without a visual beat (see VISUAL_BEATS.md)"
            exit 1
          fi

      - name: Publish QC report to public branch
        if: always()
        run: |
          test -f QC_REPORT.md || test -f VISUAL_BEATS.md || { echo "no report generated"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan qc-report-${{ github.run_number }}
          git rm -r --cached . --quiet || true
          if [ -f QC_REPORT.md ]; then git add -f QC_REPORT.md; fi
          if [ -f VISUAL_BEATS.md ]; then git add -f VISUAL_BEATS.md; fi
          if [ -f qc.json ]; then git add -f qc.json; fi
          git commit --quiet -m "QC report — run ${{ github.run_number }} (${{ github.sha }})" || true
          git push --force origin HEAD:qc-reports
