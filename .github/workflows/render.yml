name: Render Bengali Explainer

on:
  workflow_dispatch:
    inputs:
      concurrency:
        description: "Remotion concurrency (CPU threads)"
        required: false
        default: "4"
      crf:
        description: "H.264 CRF (lower = better quality, 18 is visually lossless-ish)"
        required: false
        default: "18"
      make_release:
        description: "Attach the MP4 and delivery ZIP to a GitHub Release"
        type: boolean
        default: false
  push:
    tags:
      - "render-*"

permissions:
  contents: write

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      CONCURRENCY: ${{ inputs.concurrency || '4' }}
      CRF: ${{ inputs.crf || '18' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify source assets
        run: |
          test -f public/audio/voiceover.wav
          test -f public/fonts/NotoSansBengali.ttf
          count=$(ls public/audio/sfx/*.wav | wc -l)
          echo "SFX files: $count"
          test "$count" -eq 9

      - name: Type-check
        run: npx tsc --noEmit

      - name: Render preview stills
        run: |
          mkdir -p out/preview
          npx remotion still PayYourselfFirst out/preview/01-opening.png --frame=109
          npx remotion still PayYourselfFirst out/preview/02-trap.png --frame=3344
          npx remotion still PayYourselfFirst out/preview/03-ledger.png --frame=4140
          npx remotion still PayYourselfFirst out/preview/04-growth.png --frame=6259
          npx remotion still PayYourselfFirst out/preview/05-tiers.png --frame=9327
          npx remotion still PayYourselfFirst out/preview/06-outro.png --frame=15898

      - name: Render MP4
        run: |
          npx remotion render PayYourselfFirst out/final-video.mp4 \
            --concurrency="$CONCURRENCY" \
            --crf="$CRF" \
            --log=verbose

      - name: Quality control
        run: python3 scripts/qc.py out/final-video.mp4 QC_REPORT.md

      - name: Build delivery ZIP
        if: always()
        run: bash scripts/package_delivery.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-${{ github.run_number }}
          path: |
            out/final-video.mp4
            out/preview/*.png
            QC_REPORT.md
            bengali-finance-video-delivery.zip
          if-no-files-found: warn
          retention-days: 14

      - name: Create GitHub Release
        if: ${{ (inputs.make_release == true) || startsWith(github.ref, 'refs/tags/render-') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('render-{0}', github.run_number) }}
          name: "Bengali explainer — render ${{ github.run_number }}"
          body: |
            Automated Remotion render of the Bengali "Pay Yourself First" explainer.

            - 1920x1080, 30 fps, H.264 (yuv420p) + AAC
            - Voiceover unmodified; no burned-in subtitles
            - QC results: see `QC_REPORT.md` inside the delivery ZIP
          files: |
            out/final-video.mp4
            bengali-finance-video-delivery.zip
          fail_on_unmatched_files: true
