name: Render Bengali Explainer

on:
  workflow_dispatch:
    inputs:
      concurrency:
        description: "Remotion concurrency (CPU threads)"
        required: false
        default: "4"
      crf:
        description: "H.264 CRF (lower = better quality, 18 is visually lossless-ish)"
        required: false
        default: "18"
      make_release:
        description: "Attach the MP4 and delivery ZIP to a GitHub Release"
        type: boolean
        default: false
  push:
    tags:
      - "render-*"

permissions:
  contents: write

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      CONCURRENCY: ${{ inputs.concurrency || '4' }}
      CRF: ${{ inputs.crf || '18' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify source assets
        run: |
          test -f public/audio/voiceover.wav
          test -f public/audio/voiceover-sample.wav
          test -f public/audio/score-sample.wav
          test -f public/fonts/NotoSansBengali.ttf
          test -f public/images/rakib.png
          test -f public/images/suman.png
          count=$(ls public/audio/sfx/*.wav | wc -l)
          echo "SFX files: $count"
          test "$count" -eq 9

      - name: Render preview stills (Sample60)
        run: |
          mkdir -p out/preview
          npx remotion still Sample60 out/preview/01-opening.png --frame=40
          npx remotion still Sample60 out/preview/02-friends.png --frame=160
          npx remotion still Sample60 out/preview/03-office.png --frame=320
          npx remotion still Sample60 out/preview/04-same-life.png --frame=430
          npx remotion still Sample60 out/preview/05-2025.png --frame=640
          npx remotion still Sample60 out/preview/06-rakib.png --frame=760
          npx remotion still Sample60 out/preview/07-suman-beat.png --frame=822
          npx remotion still Sample60 out/preview/08-suman.png --frame=960
          npx remotion still Sample60 out/preview/09-question.png --frame=1200
          npx remotion still Sample60 out/preview/10-answer.png --frame=1440
          npx remotion still Sample60 out/preview/11-habit.png --frame=1700

      - name: Render sample MP4 (first 60 seconds)
        run: |
          npx remotion render Sample60 out/sample-60s.mp4 \
            --concurrency="$CONCURRENCY" \
            --crf="$CRF" \
            --log=verbose

      - name: Quality control
        run: python3 scripts/qc.py out/sample-60s.mp4 QC_REPORT.md

      - name: Build delivery ZIP
        if: always()
        run: bash scripts/package_delivery.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-${{ github.run_number }}
          path: |
            out/sample-60s.mp4
            out/preview/*.png
            QC_REPORT.md
            bengali-finance-video-delivery.zip
          if-no-files-found: warn
          retention-days: 14

      - name: Create GitHub Release
        if: ${{ (inputs.make_release == true) || startsWith(github.ref, 'refs/tags/render-') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('render-{0}', github.run_number) }}
          name: "Bengali explainer sample — render ${{ github.run_number }}"
          body: |
            Automated Remotion render of the first 60 seconds (Sample60) of the
            Bengali "Pay Yourself First" documentary explainer.

            - 1920x1080, 30 fps, H.264 (yuv420p) + AAC, 59.30 s
            - Voiceover trimmed from the original (unmodified source kept); quiet
              code-generated score bed and 33 SFX cues mixed under the voice
            - Uses the two real character photos (background-removed)
            - No burned-in subtitles
            - QC results: see `QC_REPORT.md` inside the delivery ZIP
          files: |
            out/sample-60s.mp4
            bengali-finance-video-delivery.zip
          fail_on_unmatched_files: true
